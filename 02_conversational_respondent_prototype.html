<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SurveyAI — Conversational Respondent Prototype</title>
<style>
  :root{
    --accent:#2E5BFF; --bg:#F5F7FA; --card:#FFFFFF; --text:#1F2937; --grey:#6B7280;
    --border:#E3E8EF; --ai:#7B4FA0; --ai-bg:#F1E9F7; --bot:#F1F4F8; --user:#2E5BFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px;}
  .phone{width:420px;height:760px;background:var(--card);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,0.15);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);}
  .chatbar{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .chatbar .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
  .chatbar .title{font-weight:600;font-size:14px;}
  .chatbar .progress{margin-left:auto;font-size:11px;color:var(--grey);}
  .progressbar{height:3px;background:var(--border);}
  .progressfill{height:100%;background:var(--accent);transition:width .3s;}
  .messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.4;}
  .msg.bot{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px;}
  .msg.bot.ai{background:var(--ai-bg);border:1px solid #E4D6F0;}
  .msg.bot.ai .tag{display:block;font-size:10px;font-weight:700;color:var(--ai);margin-bottom:4px;}
  .msg.user{background:var(--user);color:white;align-self:flex-end;border-bottom-right-radius:4px;}
  .typing{align-self:flex-start;background:var(--bot);padding:10px 14px;border-radius:14px;border-bottom-left-radius:4px;}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--grey);margin-right:3px;animation:blink 1.2s infinite;}
  .dot:nth-child(2){animation-delay:.2s;} .dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.3;}40%{opacity:1;}}
  .inputarea{border-top:1px solid var(--border);padding:14px 16px;}
  .choices{display:flex;flex-direction:column;gap:8px;}
  .choice-btn{border:1.5px solid var(--border);background:white;border-radius:10px;padding:10px 14px;font-size:13px;text-align:left;cursor:pointer;}
  .choice-btn:hover{border-color:var(--accent);background:#F8FBFE;}
  .scale-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .scale-btn{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);background:white;cursor:pointer;font-size:13px;}
  .scale-btn:hover{border-color:var(--accent);background:#F8FBFE;}
  .stars{display:flex;gap:6px;justify-content:center;font-size:26px;cursor:pointer;}
  .star{color:#D9DEE5;}
  .star.active{color:#F0B429;}
  .textinput{display:flex;gap:8px;}
  .textinput input, .textinput textarea{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;}
  .sendbtn{background:var(--accent);color:white;border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;}
  .donebox{text-align:center;padding:30px 10px;}
  .donebox .big{font-size:34px;margin-bottom:6px;}
  .mock-note{font-size:10.5px;color:var(--ai);text-align:center;padding:6px 0 0;}
</style>
</head>
<body>

<div class="phone">
  <div class="chatbar">
    <div class="logo">S</div>
    <div class="title">Customer Feedback</div>
    <div class="progress" id="progressLabel">Q1 of 4</div>
  </div>
  <div class="progressbar"><div class="progressfill" id="progressFill" style="width:0%;"></div></div>
  <div class="messages" id="messages"></div>
  <div class="inputarea" id="inputArea"></div>
</div>

<script>
const questions = [
  {id:1, type:'nps', text:"On a scale of 0–10, how likely are you to recommend us to a friend or colleague?"},
  {id:2, type:'choice', text:"Would you be interested in a premium AI-analysis add-on?", options:["Yes, definitely","Maybe, tell me more","No, not interested"]},
  {id:3, type:'open', text:"What's the main reason for your answer?", ai_followup:true},
  {id:4, type:'rating', text:"Overall, how would you rate your experience with us today?"},
];
let qIndex = 0;
let answers = [];

const messagesEl = document.getElementById('messages');
const inputArea = document.getElementById('inputArea');

function updateProgress(){
  document.getElementById('progressLabel').innerText = `Q${Math.min(qIndex+1, questions.length)} of ${questions.length}`;
  document.getElementById('progressFill').style.width = `${Math.min((qIndex)/questions.length,1)*100}%`;
}

function addMsg(text, who, opts={}){
  const div = document.createElement('div');
  div.className = `msg ${who}` + (opts.ai ? ' ai' : '');
  div.innerHTML = (opts.ai ? '<span class="tag">⚡ AI follow-up</span>' : '') + text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping(cb, delay=900){
  const div = document.createElement('div');
  div.className = 'typing';
  div.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  setTimeout(()=>{ div.remove(); cb(); }, delay);
}

function askCurrent(){
  if(qIndex >= questions.length){ finish(); return; }
  updateProgress();
  const q = questions[qIndex];
  showTyping(()=>{
    addMsg(q.text, 'bot');
    renderInput(q);
  });
}

function renderInput(q){
  inputArea.innerHTML = '';
  if(q.type === 'choice'){
    const wrap = document.createElement('div'); wrap.className='choices';
    q.options.forEach(opt=>{
      const b = document.createElement('button');
      b.className='choice-btn'; b.innerText=opt;
      b.onclick = ()=>submitAnswer(opt);
      wrap.appendChild(b);
    });
    inputArea.appendChild(wrap);
  } else if(q.type === 'nps'){
    const wrap = document.createElement('div'); wrap.className='scale-row';
    for(let n=0;n<=10;n++){
      const b = document.createElement('button');
      b.className='scale-btn'; b.innerText=n;
      b.onclick = ()=>submitAnswer(n.toString());
      wrap.appendChild(b);
    }
    inputArea.appendChild(wrap);
  } else if(q.type === 'rating'){
    const wrap = document.createElement('div'); wrap.className='stars';
    for(let n=1;n<=5;n++){
      const s = document.createElement('span');
      s.className='star'; s.innerText='★'; s.dataset.n=n;
      s.onclick = ()=>submitAnswer(n+' / 5 stars');
      wrap.appendChild(s);
    }
    inputArea.appendChild(wrap);
  } else if(q.type === 'open'){
    const wrap = document.createElement('div'); wrap.className='textinput';
    const ta = document.createElement('textarea'); ta.rows=1; ta.placeholder='Type your answer...';
    const btn = document.createElement('button'); btn.className='sendbtn'; btn.innerText='➤';
    btn.onclick = ()=>{ if(ta.value.trim()) submitAnswer(ta.value.trim()); };
    wrap.appendChild(ta); wrap.appendChild(btn);
    inputArea.appendChild(wrap);
  }
}

function generateFollowup(answerText){
  const lower = answerText.toLowerCase();
  if(lower.includes('price') || lower.includes('expensive') || lower.includes('cost')){
    return "Got it — roughly what price point would feel fair to you?";
  }
  if(lower.includes('slow') || lower.includes('bug') || lower.includes('issue') || lower.includes('problem')){
    return "Sorry to hear that. Could you tell me a bit more about what went wrong?";
  }
  if(lower.includes('love') || lower.includes('great') || lower.includes('good') || lower.includes('easy')){
    return "Glad to hear it! What's the one feature you'd miss most if it went away?";
  }
  return "Thanks for sharing that — is there anything specific that would make this even better for you?";
}

function submitAnswer(value){
  addMsg(value, 'user');
  answers.push({question: questions[qIndex].text, answer: value});
  inputArea.innerHTML = '';
  const q = questions[qIndex];

  if(q.type === 'open' && q.ai_followup && !q._followedUp){
    q._followedUp = true;
    showTyping(()=>{
      const followup = generateFollowup(value);
      addMsg(followup, 'bot', {ai:true});
      renderInput({type:'open'});
    }, 1100);
    // override send button for the dynamically generated follow-up
    setTimeout(()=>{
      const sendBtn = inputArea.querySelector('.sendbtn');
      const ta = inputArea.querySelector('textarea');
      if(sendBtn && ta){
        sendBtn.onclick = ()=>{ if(ta.value.trim()){ addMsg(ta.value.trim(),'user'); answers.push({question:'AI follow-up', answer: ta.value.trim()}); inputArea.innerHTML=''; qIndex++; askCurrent(); } };
      }
    }, 1300);
    return;
  }
  qIndex++;
  askCurrent();
}

function finish(){
  updateProgress();
  document.getElementById('progressFill').style.width = '100%';
  showTyping(()=>{
    inputArea.innerHTML = `<div class="donebox"><div class="big">✅</div><div style="font-weight:600;">Thanks for your time!</div><div style="color:var(--grey);font-size:13px;margin-top:4px;">Your responses have been recorded.</div><div class="mock-note">This conversation used a scripted mock follow-up — real AI follow-ups wire in during Phase 4.</div></div>`;
  }, 700);
}

askCurrent();
</script>
</body>
</html>
